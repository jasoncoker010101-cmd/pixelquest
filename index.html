<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #09080b; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .tv-shell {
    position: relative; width: min(96vw, 1040px, calc(88dvh * 4 / 3)); max-height: 88dvh; aspect-ratio: 4 / 3;
    padding: clamp(10px, 2vw, 24px); border-radius: 7% / 9%;
    background: linear-gradient(145deg, #39363a, #171619 42%, #29262a 72%, #111);
    box-shadow: 0 24px 65px #000, inset 0 2px 4px #7778, inset 0 -7px 12px #000;
  }
  .tv-shell::before {
    content: ""; position: absolute; inset: 3.5%; border-radius: 7% / 9%;
    border: 2px solid #080709; box-shadow: inset 0 0 0 2px #ffffff0b, 0 1px 2px #7775;
    pointer-events: none; z-index: 2;
  }
  .tv-shell::after {
    content: ""; position: absolute; inset: clamp(10px, 2vw, 24px);
    border-radius: 4% / 5%; pointer-events: none; z-index: 3;
    background: repeating-linear-gradient(to bottom, transparent 0, #05030b18 2px, transparent 4px),
      radial-gradient(ellipse at center, transparent 58%, #05020b66 100%);
    box-shadow: inset 0 0 24px #0009;
  }
  canvas {
    display: block; width: 100%; height: 100%; border-radius: 4% / 5%;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; filter: saturate(.88) contrast(1.08);
  }
  @media (max-width: 900px) {
    body { min-height: 100dvh; padding: 12px 0; }
    .tv-shell { width: min(90vw, calc(82dvh * 4 / 3)); max-height: 82dvh; padding: 8px; }
  }
  @media (max-width: 600px) {
    .tv-shell { width: min(88vw, calc(76dvh * 4 / 3)); max-height: 76dvh; padding: 7px; }
    .tv-shell::after { inset: 7px; }
  }
  .mobile-controls {
    display: none; position: absolute; z-index: 5; left: 4%; right: 4%; bottom: 5%;
    align-items: flex-end; justify-content: space-between; pointer-events: none;
  }
  .mobile-pad { display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(2, 34px); gap: 3px; pointer-events: none; }
  .mobile-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; width: 118px; pointer-events: none; }
  .mobile-controls button {
    width: 34px; height: 34px; padding: 0; border: 1px solid #f1d18a; border-radius: 8px;
    background: #241a2bd9; color: #fff0c5; font: bold 12px monospace;
    box-shadow: 0 2px 5px #0009; touch-action: none; pointer-events: auto; user-select: none;
  }
  .mobile-actions button { width: 34px; height: 30px; font-size: 9px; }
  .mobile-pad button:active, .mobile-actions button:active { background: #9a6847; }
  .tv-shell.playing .mobile-controls { display: flex; }

  .tv-fullscreen-btn {
    position: absolute; z-index: 6; right: 5%; bottom: 1.2%;
    border: 1px solid #c5a978; border-radius: 5px;
    padding: 5px 9px; color: #f8e8c4; background: #17121ddd;
    font: bold 10px monospace; letter-spacing: .5px;
    box-shadow: 0 2px 6px #000a; cursor: pointer;
    touch-action: manipulation;
  }
  .tv-fullscreen-btn:active { background: #60432f; }
  .tv-shell:fullscreen {
    width: 100vw; height: 100dvh; max-width: none; max-height: none;
    aspect-ratio: auto; padding: 0; border-radius: 0;
    display: flex; align-items: center; justify-content: center;
    background: #09080b; box-shadow: none; overflow: hidden;
  }
  .tv-shell:fullscreen canvas {
    width: min(100vw, calc(100dvh * 4 / 3));
    height: min(100dvh, calc(100vw * 3 / 4));
    flex: 0 0 auto;
  }
  .tv-shell:fullscreen::before {
    inset: max(1%, 5px); border-radius: 3% / 4%;
  }
  .tv-shell:fullscreen::after {
    inset: max(1.5%, 8px); border-radius: 3% / 4%;
  }
  .tv-shell:fullscreen .tv-fullscreen-btn {
    right: max(3%, 14px); bottom: max(2%, 12px);
    opacity: .72;
  }
  @media (max-width: 600px) {
    .tv-fullscreen-btn { right: 4%; bottom: 1%; padding: 4px 7px; font-size: 9px; }
  }

  @media (pointer: coarse) {
    .tv-shell { -webkit-tap-highlight-color: transparent; }
  }
</style>

<script>
(async function pixelquestUpdateLoader(){
  const repoApi = 'https://api.github.com/repos/jasoncoker010101-cmd/pixelquest/branches/main';
  const params = new URLSearchParams(location.search);
  const currentRev = params.get('pqrev') || '';
  async function getLatestRevision(){
    try {
      const response = await fetch(repoApi, { cache: 'no-store', headers: { Accept: 'application/vnd.github+json' } });
      if (!response.ok) throw new Error('GitHub update check failed');
      const data = await response.json();
      return data && data.commit && data.commit.sha ? data.commit.sha : '';
    } catch (_) { return ''; }
  }
  const latest = await getLatestRevision();
  if (latest && latest !== currentRev) {
    params.set('pqrev', latest);
    location.replace(location.pathname + '?' + params.toString() + location.hash);
    return;
  }
  window.PQ_REV = latest || currentRev || String(Date.now());
  const gameScript = document.createElement('script');
  gameScript.src = 'world.js?rev=' + encodeURIComponent(window.PQ_REV);
  gameScript.onload = () => {
    // Check periodically so an already-open game notices new commits too.
    setInterval(async () => {
      const newer = await getLatestRevision();
      if (newer && newer !== window.PQ_REV) {
        const next = new URL(location.href);
        next.searchParams.set('pqrev', newer);
        location.replace(next.toString());
      }
    }, 120000);
  };
  gameScript.onerror = () => {
    // If GitHub's API is unavailable, still bypass the browser's cached script.
    const fallback = document.createElement('script');
    fallback.src = 'world.js?reload=' + Date.now();
    document.body.appendChild(fallback);
  };
  document.body.appendChild(gameScript);
})();
</script>
<script>
const tvShell = document.getElementById('tvShell');
const tvFullscreenButton = document.getElementById('tvFullscreen');
async function toggleTVFullscreen() {
  try {
    if (document.fullscreenElement === tvShell) {
      await document.exitFullscreen();
    } else if (tvShell.requestFullscreen) {
      await tvShell.requestFullscreen();
    } else {
      message = 'Fullscreen is not supported by this browser.';
    }
  } catch (error) {
    message = 'Could not enter fullscreen. Try rotating your device or browser settings.';
  }
}
tvFullscreenButton.addEventListener('click', toggleTVFullscreen);
document.addEventListener('fullscreenchange', () => {
  const active = document.fullscreenElement === tvShell;
  tvFullscreenButton.textContent = active ? '⛶ EXIT TV' : '⛶ TV FULLSCREEN';
  tvFullscreenButton.setAttribute('aria-label', active ? 'Exit TV fullscreen' : 'Enter TV fullscreen');
});
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let t = 0, last = performance.now(), message = '';
const settings = { music: true, sound: true };
const state = { screen: 'title', sel: 0 };
let inWorld = false;
let activeSlot = 0;
const SAVE_KEY = 'pixelquest-save-';
const CLOUD_URL = 'https://nvqurbmopxohbcjxuogy.supabase.co';
const CLOUD_KEY = 'sb_publishable_xLrZKJZnifoDQFvBXFbgug_5DmzsypK';
const AUTH_KEY = 'pixelquest-auth-session';
let cloudSession = null;
let cloudProfile = null;
try { cloudSession = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch { cloudSession = null; }

function storeSession(session) {
  cloudSession = session;
  if (session) localStorage.setItem(AUTH_KEY, JSON.stringify(session));
  else localStorage.removeItem(AUTH_KEY);
}

async function authRequest(path, body) {
  const response = await fetch(CLOUD_URL + '/auth/v1/' + path, {
    method: 'POST',
    headers: { apikey: CLOUD_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.msg || data.message || data.error_description || data.error || 'Account request failed.');
  return data;
}

async function refreshCloudSession() {
  if (!cloudSession || !cloudSession.refresh_token) return false;
  try {
    const data = await authRequest('token?grant_type=refresh_token', { refresh_token: cloudSession.refresh_token });
    storeSession(data);
    return true;
  } catch {
    storeSession(null);
    cloudProfile = null;
    return false;
  }
}

async function cloudRequest(path, options = {}, retry = true) {
  if (!cloudSession) throw new Error('Sign in to use cloud saves.');
  const response = await fetch(CLOUD_URL + path, {
    ...options,
    headers: {
      apikey: CLOUD_KEY,
      Authorization: 'Bearer ' + cloudSession.access_token,
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });
  if (response.status === 401 && retry && await refreshCloudSession()) return cloudRequest(path, options, false);
  const body = response.status === 204 ? null : await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.message || body.details || body.hint || 'Cloud request failed.');
  return body;
}

async function loadCloudProfile() {
  if (!cloudSession) return null;
  const rows = await cloudRequest('/rest/v1/profiles?select=username&id=eq.' + encodeURIComponent(cloudSession.user.id) + '&limit=1');
  cloudProfile = rows && rows[0] ? rows[0] : null;
  return cloudProfile;
}

async function saveCloudProfile(username) {
  await cloudRequest('/rest/v1/profiles?on_conflict=id', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ id: cloudSession.user.id, username, updated_at: new Date().toISOString() })
  });
  cloudProfile = { username };
}

async function loadCloudSlot(slot) {
  const rows = await cloudRequest('/rest/v1/game_saves?select=save_data&slot=eq.' + slot + '&user_id=eq.' + encodeURIComponent(cloudSession.user.id) + '&limit=1');
  return rows && rows[0] ? rows[0].save_data : null;
}

async function saveCloudSlot(slot, data) {
  if (!cloudSession || !data) return;
  await cloudRequest('/rest/v1/game_saves?on_conflict=user_id,slot', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ user_id: cloudSession.user.id, slot, save_data: data, updated_at: new Date().toISOString() })
  });
}

async function deleteCloudSlot(slot) {
  if (!cloudSession) return;
  await cloudRequest('/rest/v1/game_saves?slot=eq.' + slot + '&user_id=eq.' + encodeURIComponent(cloudSession.user.id), {
    method: 'DELETE',
    headers: { Prefer: 'return=minimal' }
  });
}

async function signInOrCreate(createAccount) {
  const email = prompt('Enter your email address:');
  if (!email) return;
  const password = prompt('Enter your password (at least 6 characters):');
  if (!password) return;
  try {
    const data = await authRequest(createAccount ? 'signup' : 'token?grant_type=password', { email: email.trim(), password });
    if (!data.access_token) {
      message = 'Check your email to confirm your account, then sign in.';
      return;
    }
    storeSession(data);
    await loadCloudProfile();
    if (!cloudProfile) {
      const username = prompt('Choose a player name (3-24 characters):');
      if (username && username.trim().length >= 3 && username.trim().length <= 24) await saveCloudProfile(username.trim());
      else await saveCloudProfile('Player' + data.user.id.slice(0, 6));
    }
    message = 'Signed in! Cloud saves are ready.';
  } catch (error) {
    message = error.message;
  }
}

async function signOut() {
  try {
    if (cloudSession) await cloudRequest('/auth/v1/logout', { method: 'POST' }).catch(() => {});
  } finally {
    storeSession(null);
    cloudProfile = null;
    message = 'Signed out. Browser saves are still available.';
  }
}

async function enterAccountAction(index) {
  if (cloudSession && !cloudProfile) {
    try { await loadCloudProfile(); } catch (error) { message = error.message; }
  }
  if (!cloudSession) {
    if (index === 0) await signInOrCreate(false);
    else if (index === 1) await signInOrCreate(true);
    else go('title');
  } else {
    if (index === 0) {
      const current = cloudProfile && cloudProfile.username || 'Player';
      const username = prompt('Player name (3-24 characters):', current);
      if (username && username.trim().length >= 3 && username.trim().length <= 24) {
        try { await saveCloudProfile(username.trim()); message = 'Profile updated.'; }
        catch (error) { message = error.message; }
      }
    } else if (index === 1) await signOut();
    else go('title');
  }
}

async function syncCloudSlot(slot) {
  if (!cloudSession) return null;
  return await loadCloudSlot(slot);
}

function readSlot(slot) {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY + slot) || 'null'); }
  catch { return null; }
}

function slotLabels() {
  return [1, 2, 3].map(n => {
    const save = readSlot(n);
    return save ? `SLOT ${n} - CH.${save.chapter || 1} LV ${(save.stats && save.stats.level) || 1}` : `SLOT ${n} - NEW GAME`;
  }).concat('BACK');
}

function saveActiveSlot(data) {
  try { localStorage.setItem(SAVE_KEY + activeSlot, JSON.stringify(data)); }
  catch (error) { console.warn('Could not save Pixel Quest slot.', error); }
  if (cloudSession) saveCloudSlot(activeSlot, data).catch(error => { message = 'Cloud save error: ' + error.message; });
}

async function enterWorld(slot) {
  activeSlot = slot || 1;
  message = cloudSession ? 'LOADING CLOUD SAVE...' : '';
  let save = readSlot(activeSlot);
  if (cloudSession) {
    // Never start with a local fallback when cloud loading fails: it could overwrite a real cloud save.
    try {
      const cloudSave = await syncCloudSlot(activeSlot);
      save = cloudSave;
      try {
        if (cloudSave) localStorage.setItem(SAVE_KEY + activeSlot, JSON.stringify(cloudSave));
        else localStorage.removeItem(SAVE_KEY + activeSlot);
      } catch {}
    } catch (error) {
      message = 'CLOUD LOAD FAILED: ' + error.message;
      return;
    }
  }
  inWorld = true;
  Overworld.init(canvas, exitWorld, save, saveActiveSlot);
}

function exitWorld(data) {
  if (data) saveActiveSlot(data);
  inWorld = false;
}

function rnd(i) { return Math.abs(Math.sin(i * 12.9898 + 78.233) * 43758.5453) % 1; }

const stars = [...Array(48)].map((_, i) => ({
  x: Math.floor(rnd(i + 12) * 320), y: Math.floor(rnd(i + 50) * 92), p: rnd(i + 99) * 6,
  size: i % 9 === 0 ? 2 : 1
}));
const clouds = [
  { x: -8, y: 126, w: 86 }, { x: 116, y: 145, w: 116 },
  { x: 258, y: 119, w: 78 }, { x: 35, y: 174, w: 62 }
];
const motes = [...Array(22)].map((_, i) => ({
  x: rnd(i + 300) * 320, y: 104 + rnd(i + 400) * 132, s: rnd(i + 500), ph: rnd(i + 600) * 6
}));

const screens = {
  title:    { y: 118, items: () => ['START GAME', 'ACCOUNT', 'SETTINGS', 'CREDITS'] },
  slots:    { y: 100, items: slotLabels },
  settings: { y: 110, items: () => ['MUSIC: ' + (settings.music ? 'ON' : 'OFF'), 'SOUND: ' + (settings.sound ? 'ON' : 'OFF'), 'BACK'] },
  credits:  { y: 190, items: () => ['BACK'] },
  account:  { y: 104, items: () => cloudSession ? ['PROFILE / NAME', 'SIGN OUT', 'BACK'] : ['SIGN IN', 'CREATE ACCOUNT', 'BACK'] },
  deleteConfirm: { y: 150, items: () => ['YES, DELETE', 'CANCEL'] }
};

function rectFor(s, i) { return { x: 100, y: s.y + i * 20, w: 120, h: 14 }; }

function go(name) { state.screen = name; state.sel = 0; message = ''; }

function activate() {
  const id = state.screen, sel = state.sel;
  if (id === 'title') go(['slots', 'account', 'settings', 'credits'][sel]);
  else if (id === 'slots') { if (sel === 3) go('title'); else enterWorld(sel + 1); }
  else if (id === 'deleteConfirm') {
    if (sel === 0) {
      const slot = state.deleteSlot;
      try { localStorage.removeItem(SAVE_KEY + slot); } catch {}
      if (cloudSession) {
        deleteCloudSlot(slot).then(() => { message = 'SAVE SLOT ' + slot + ' DELETED'; })
          .catch(error => { message = 'LOCAL SAVE DELETED; CLOUD ERROR: ' + error.message; });
      } else message = 'SAVE SLOT ' + slot + ' DELETED';
      go('slots');
    } else go('slots');
  }
  else if (id === 'account') { enterAccountAction(sel); }
  else if (id === 'settings') {
    if (sel === 0) settings.music = !settings.music;
    else if (sel === 1) settings.sound = !settings.sound;
    else go('title');
  }
  else if (id === 'credits') go('title');
}

function back() { if (state.screen === 'deleteConfirm') go('slots'); else if (state.screen !== 'title') go('title'); }

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (inWorld) return;
  if (k === 'o' && state.screen === 'title') { enterWorld(); return; }
  if (['arrowup', 'arrowdown', 'w', 's', ' ', 'enter', 'escape'].includes(k)) e.preventDefault();
  const count = screens[state.screen].items().length;
  if (k === 'arrowup' || k === 'w') state.sel = (state.sel + count - 1) % count;
  else if (k === 'arrowdown' || k === 's') state.sel = (state.sel + 1) % count;
  else if (k === 'enter' || k === ' ') activate();
  else if (k === 'escape') back();
});

function toCanvas(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * 320 / r.width, y: (e.clientY - r.top) * 240 / r.height };
}
function hit(p) {
  if (state.screen === 'slots') {
    for (let slot = 1; slot <= 3; slot++) {
      const y = screens.slots.y + (slot - 1) * 20;
      if (p.x >= 224 && p.x <= 244 && p.y >= y - 2 && p.y <= y + 16) {
        state.deleteSlot = slot;
        return 100 + slot;
      }
    }
  }
  const s = screens[state.screen];
  const n = s.items().length;
  for (let i = 0; i < n; i++) {
    const r = rectFor(s, i);
    if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return i;
  }
  return -1;
}
canvas.addEventListener('mousemove', e => {
  if (inWorld) return;
  const p = toCanvas(e);
  if (state.screen === 'slots' && p.x >= 224 && p.x <= 244 && p.y >= 98 && p.y <= 156) return;
  const i = hit(p);
  if (i >= 0 && i < 100) state.sel = i;
});
canvas.addEventListener('click', e => {
  if (inWorld) return;
  const i = hit(toCanvas(e));
  if (i >= 100) { state.sel = 0; state.screen = 'deleteConfirm'; message = ''; return; }
  if (i >= 0) { state.sel = i; activate(); }
});

// Touch controls send the same keyboard events used by the desktop controls.
document.querySelectorAll('[data-game-key]').forEach(button => {
  const key = button.dataset.gameKey;
  const code = key === 'z' ? 'KeyZ' : key === 'Shift' ? 'ShiftLeft' : key.startsWith('Arrow') ? key : '';
  const press = event => {
    event.preventDefault();
    button.setPointerCapture?.(event.pointerId);
    window.dispatchEvent(new KeyboardEvent('keydown', { key, code, bubbles: true, cancelable: true }));
  };
  const release = event => {
    event.preventDefault();
    window.dispatchEvent(new KeyboardEvent('keyup', { key, code, bubbles: true, cancelable: true }));
  };
  button.addEventListener('pointerdown', press);
  button.addEventListener('pointerup', release);
  button.addEventListener('pointercancel', release);
  button.addEventListener('lostpointercapture', release);
});

function update(dt) {
  updateMenuFx(dt);
  clouds.forEach(c => { c.x -= dt * 4; if (c.x + c.w < 0) c.x = 320; });
  motes.forEach(m => {
    m.y -= dt * (4 + m.s * 4);
    m.x += Math.sin(t + m.ph) * 0.15;
    if (m.y < 150) { m.y = 236; m.x = Math.random() * 320; }
  });
}

// ---- Main menu art: the Moonfall title screen ----
const menuKnight = new Image(); menuKnight.src = 'assets/knight/Idle.png';
const TITLE = 'PIXELQUEST';
let menuStart = -1;               // time the title animation began
let cursorY = 118;                // sliding sword cursor
let comet = null, nextComet = 3.5, landFlash = 0, landX = 0;
let shooting = null, nextShoot = 6;
const embers = [];
const ridges = [0, 1].map(layer => [...Array(42)].map((_, i) => rnd(i * 3 + layer * 91)));

function updateMenuFx(dt) {
  if (menuStart < 0) menuStart = t;
  // The moon shard periodically breaks loose and falls to earth.
  nextComet -= dt;
  if (!comet && nextComet <= 0) {
    comet = { x: 252, y: 112, vx: -70 - Math.random() * 20, vy: 6, trail: [] };
    nextComet = 11 + Math.random() * 5;
  }
  if (comet) {
    comet.vy += dt * 22;
    comet.x += comet.vx * dt; comet.y += comet.vy * dt;
    comet.trail.push({ x: comet.x, y: comet.y, life: 0.9 });

  landFlash = Math.max(0, landFlash - dt * 0.9);
  nextShoot -= dt;

  if (shooting) { shooting.x += dt * 170; shooting.y += dt * 60; shooting.life -= dt; if (shooting.life <= 0) shooting = null; }
  // Campfire embers.
  if (Math.random() < dt * 14) embers.push({ x: 74 + (Math.random() - 0.5) * 6, y: 204, vx: (Math.random() - 0.5) * 8, vy: -18 - Math.random() * 20, life: 1.4 + Math.random() });

  }
  const s = screens[state.screen];
  const target = s ? s.y + state.sel * 20 : 118;
  cursorY += (target - cursorY) * Math.min(1, dt * 14);
}

  ctx.fillRect(x - 11, y - 8, 22, 16);
  ctx.fillRect(x - 5, y - 15, 10, 30);
  ctx.fillStyle = '#e3e5df';
  ctx.fillRect(x - 5, y - 9, 7, 3);
  ctx.fillRect(x + 2, y - 2, 5, 4);
  ctx.fillRect(x - 7, y + 4, 4, 3);
  ctx.fillStyle = '#9baac3';
  ctx.fillRect(x + 5, y - 7, 3, 2);
  ctx.fillRect(x - 3, y + 1, 4, 2);
}

function drawPixelTree(x, baseY, scale, shade, highlight, variant = 0) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(baseY));
  ctx.scale(scale, scale);

  // Layered, stepped canopy makes a forest silhouette instead of smooth triangles.
  const rows = variant % 2
    ? [[5,-53],[10,-47],[15,-41],[19,-35],[22,-29],[23,-23],[21,-17],[17,-11],[12,-5]]
    : [[4,-55],[9,-49],[14,-43],[18,-37],[21,-31],[22,-25],[20,-19],[16,-13],[11,-7]];
  ctx.fillStyle = '#0b1220';
  ctx.fillRect(-2, -5, 4, 18);
  ctx.fillStyle = shade;
  rows.forEach(([width, yy], index) => {
    ctx.fillRect(-width, yy, width * 2, 7);
    if (index > 1 && index < 7) {
      ctx.fillStyle = highlight;
      ctx.fillRect(-width + 2, yy + 1, Math.max(2, Math.floor(width * 0.45)), 2);
      ctx.fillStyle = shade;
    }
  });
  ctx.fillStyle = '#101b25';
  ctx.fillRect(-1, 1, 2, 10);
  ctx.restore();
}

function drawForestLayer(baseY, scale, speed, palette, count, seed) {
  const drift = (t * speed) % 38;
  for (let i = -1; i <= count; i++) {
    const r = rnd(i + seed);
    const x = i * 38 - drift + r * 9;
    const treeScale = scale * (0.78 + rnd(i + seed + 22) * 0.42);
    const y = baseY + rnd(i + seed + 44) * 7;
    drawPixelTree(x, y, treeScale, palette[0], palette[1], i + seed);
  }
}

function drawForestMist() {
  ctx.save();
  clouds.forEach((c, i) => {
    const opacity = 0.055 + 0.025 * Math.sin(t * 0.45 + i);
    ctx.fillStyle = 'rgba(180,190,202,' + opacity + ')';
    ctx.fillRect(Math.round(c.x), c.y, c.w, 5);
    ctx.fillRect(Math.round(c.x + 8), c.y - 3, Math.max(8, c.w - 22), 3);
    ctx.fillRect(Math.round(c.x + 20), c.y + 5, Math.max(8, c.w - 40), 2);
  });
  ctx.restore();
}

function drawWoodlandGround() {
  ctx.fillStyle = '#192b27';
  ctx.fillRect(0, 164, 320, 76);
  ctx.fillStyle = '#20342b';
  ctx.fillRect(0, 185, 320, 55);

  // A narrow old trail disappears into the woods behind the menu.
  ctx.fillStyle = '#463d38';
  ctx.beginPath();
  ctx.moveTo(143, 165); ctx.lineTo(176, 165);
  ctx.lineTo(184, 190); ctx.lineTo(226, 240);
  ctx.lineTo(86, 240); ctx.lineTo(137, 190);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#665344';
  ctx.beginPath();
  ctx.moveTo(148, 170); ctx.lineTo(169, 170);
  ctx.lineTo(178, 196); ctx.lineTo(203, 240);
  ctx.lineTo(108, 240); ctx.lineTo(143, 196);
  ctx.closePath(); ctx.fill();

  // Uneven grass tufts and a few pale stones, anchored to the landscape.
  for (let i = 0; i < 115; i++) {
    const x = Math.floor(rnd(i + 800) * 320);
    const y = 171 + Math.floor(rnd(i + 1100) * 66);
    const sway = Math.round(Math.sin(t * 1.15 + i * 0.7) * 1);
    ctx.fillStyle = y > 205 ? '#111f1d' : '#526044';
    ctx.fillRect(x + sway, y, 1, 2 + (i % 3));
    if (i % 13 === 0) {
      ctx.fillStyle = '#817865';
      ctx.fillRect(x + 4, y + 4, 2, 1);
    }
  }
}

function drawFireflies() {
  motes.forEach((m, i) => {
    const pulse = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * 2 + m.ph));
    const x = Math.round(m.x + Math.sin(t * 0.8 + m.ph) * 2);
    const y = Math.round(m.y + Math.sin(t * 1.1 + m.ph) * 2);
    ctx.fillStyle = 'rgba(245,218,139,' + (pulse * 0.14) + ')';
    ctx.fillRect(x - 2, y - 2, 5, 5);
    ctx.fillStyle = 'rgba(255,236,165,' + (pulse * 0.9) + ')';
    ctx.fillRect(x, y, 2, 2);
  });
}

function draw() {
  ctx.clearRect(0, 0, 320, 240);
  drawMoonfallSky();
  drawCrackedMoon();
  drawRidge(0, 156, 46, '#26234a', 1.2);
  drawRidge(1, 170, 34, '#1a1834', 2.4);
  drawForestMist();
  drawForestLayer(178, 0.9, 4, ['#0e1420', '#1a2433'], 10, 100);
  drawForestLayer(198, 1.08, 7, ['#090d16', '#141c28'], 10, 180);
  ctx.fillStyle = '#080b12'; ctx.fillRect(0, 204, 320, 36);
  drawCampScene();
  drawPixelTree(309 + Math.sin(t * 0.6) * 1, 246, 1.75, '#070a10', '#121a24', 1);
  drawFireflies();
  // a slow wall of fog in front of the woods
  for (let i = 0; i < 4; i++) {
    const fx = ((t * (5 + i * 2) + i * 97) % 420) - 60, fy = 186 + i * 8;
    const g = ctx.createRadialGradient(fx, fy, 2, fx, fy, 70);
    g.addColorStop(0, 'rgba(150,140,200,.10)'); g.addColorStop(1, 'rgba(150,140,200,0)');
    ctx.fillStyle = g; ctx.fillRect(fx - 70, fy - 30, 140, 60);
  }
  if (state.screen !== 'title') { ctx.fillStyle = 'rgba(6,5,14,.45)'; ctx.fillRect(0, 0, 320, 240); }
  drawScreen();
  const v = ctx.createRadialGradient(160, 120, 80, 160, 120, 210);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(3,3,12,0.72)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, 320, 240);
  // fade in from black when the page opens
  const fade = clamp01(1 - (t - menuStart) / 1.2);
  if (fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + fade + ')'; ctx.fillRect(0, 0, 320, 240); }
}

function drawCRT() {
  ctx.save();
  // Fine horizontal phosphor lines and a soft curved-screen vignette.
  ctx.fillStyle = 'rgba(5, 3, 12, 0.13)';
  for (let y = 1; y < 240; y += 2) ctx.fillRect(0, y, 320, 1);
  const shade = ctx.createRadialGradient(160, 120, 72, 160, 120, 190);
  shade.addColorStop(0, 'rgba(0,0,0,0)');
  shade.addColorStop(0.72, 'rgba(0,0,0,0.04)');
  shade.addColorStop(1, 'rgba(0,0,0,0.34)');
  ctx.fillStyle = shade;
  ctx.fillRect(0, 0, 320, 240);
  ctx.restore();
}

// Native Gamepad API support for the PS5 DualSense (and other standard pads).
//
//   Left stick / D-pad  Move, navigate menus
//   ✕ Cross             Jump in the forest (interacts when a prompt is shown),
//                       interact / confirm everywhere else
//   □ Square            Attack            (R2 also attacks)
//   ○ Circle            Back / close / run from an encounter
//   △ Triangle          Inventory
//   Touchpad / Create   Stats
//   Options             Pause / resume
//   L1 / R1 / L2        Hold to run
const gamepadState = { held: new Set(), repeatAt: new Map(), actions: new Set(), index: -1 };
window.addEventListener('gamepadconnected', e => {
  gamepadState.index = e.gamepad.index;
  if (inWorld && Overworld.setInputMode) Overworld.setInputMode('pad');
});
window.addEventListener('gamepaddisconnected', e => {
  if (e.gamepad.index !== gamepadState.index && gamepadState.index !== -1) return;
  gamepadState.held.forEach(key => dispatchPadKey(key, false));
  gamepadState.held.clear(); gamepadState.repeatAt.clear(); gamepadState.actions.clear();
  gamepadState.index = -1;
  if (Overworld.setInputMode) Overworld.setInputMode('keyboard');
});
// Real keyboard use switches on-screen prompts back to keyboard keys.
window.addEventListener('keydown', e => {
  if (e.isTrusted && Overworld.setInputMode) Overworld.setInputMode('keyboard');
}, true);
function dispatchPadKey(key, down, repeat = false) {
  // The "Pad" code lets the game tell stick/D-pad input apart from the keyboard,
  // so pushing up on the stick never makes the knight jump.
  window.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', {
    key, code: 'Pad' + key, bubbles: true, cancelable: true, repeat
  }));
}
function rumble(strong, weak, ms) {
  const pad = currentPad();
  const act = pad && pad.vibrationActuator;
  if (!act || !act.playEffect) return;
  try {
    const p = act.playEffect('dual-rumble', { startDelay: 0, duration: ms, strongMagnitude: strong, weakMagnitude: weak });
    if (p && p.catch) p.catch(() => {});
  } catch (_) {}
}
window.pqRumble = rumble;
function currentPad() {
  if (!navigator.getGamepads) return null;
  const pads = navigator.getGamepads();
  if (gamepadState.index >= 0 && pads[gamepadState.index] && pads[gamepadState.index].connected) return pads[gamepadState.index];
  let fallback = null;
  for (let i = 0; i < pads.length; i++) {
    const p = pads[i];
    if (!p || !p.connected) continue;
    if (p.mapping === 'standard') { gamepadState.index = i; return p; }
    if (!fallback) fallback = p;
  }
  return fallback;
}
// Some browsers (notably Firefox) expose the DualSense without the standard
// mapping. Translate its raw layout into standard button numbers.
function readPad(pad) {
  const raw = i => !!(pad.buttons[i] && (pad.buttons[i].pressed || pad.buttons[i].value > 0.5));
  const axis = i => (pad.axes && Number.isFinite(pad.axes[i]) ? pad.axes[i] : 0);
  if (pad.mapping === 'standard') {
    return { pressed: raw, lx: axis(0), ly: axis(1) };
  }
  const sony = /054c|dualsense|wireless controller|playstation/i.test(pad.id || '');
  if (!sony) return { pressed: raw, lx: axis(0), ly: axis(1) };
  // Raw DualSense: 0 □, 1 ✕, 2 ○, 3 △, 4 L1, 5 R1, 6 L2, 7 R2, 8 Create,
  // 9 Options, 10 L3, 11 R3, 12 PS, 13 Touchpad; D-pad is a hat on axis 9.
  const hat = axis(9);
  const dir = hat >= -1.05 && hat <= 1.05 ? Math.round((hat + 1) * 3.5) % 8 : -1;
  const dpad = { 12: [7, 0, 1], 13: [3, 4, 5], 14: [5, 6, 7], 15: [1, 2, 3] };
  const map = { 0: 1, 1: 2, 2: 0, 3: 3, 4: 4, 5: 5, 6: 6, 7: 7, 8: 8, 9: 9, 10: 10, 11: 11, 16: 12, 17: 13 };
  return {
    pressed: i => (dpad[i] ? dir >= 0 && dpad[i].includes(dir) : map[i] !== undefined && raw(map[i])),
    lx: axis(0), ly: axis(1)
  };
}
function pollGamepad(now) {
  const pad = currentPad();
  if (!pad) return;
  const { pressed, lx, ly } = readPad(pad);
  const DEAD = 0.42;
  const next = new Set();
  if (pressed(14) || lx < -DEAD) next.add('ArrowLeft');
  if (pressed(15) || lx > DEAD) next.add('ArrowRight');
  if (pressed(12) || ly < -DEAD) next.add('ArrowUp');
  if (pressed(13) || ly > DEAD) next.add('ArrowDown');
  // Either shoulder (or L2) runs; release only after all are released.
  if (pressed(4) || pressed(5) || pressed(6)) next.add('Shift');
  const anyInput = next.size > 0 || [0, 1, 2, 3, 7, 8, 9, 16, 17].some(pressed);
  if (anyInput && inWorld && Overworld.setInputMode) Overworld.setInputMode('pad');
  for (const key of gamepadState.held) {
    if (!next.has(key)) { dispatchPadKey(key, false); gamepadState.repeatAt.delete(key); }
  }
  for (const key of next) {
    if (!gamepadState.held.has(key)) {
      dispatchPadKey(key, true); gamepadState.repeatAt.set(key, now + 280);
    } else if (!inWorld && key.startsWith('Arrow') && now >= (gamepadState.repeatAt.get(key) || 0)) {
      dispatchPadKey(key, true, true); gamepadState.repeatAt.set(key, now + 145);
    }
  }
  gamepadState.held = next;
  const actions = [[0, 'primary'], [2, 'attack'], [7, 'attack'], [1, 'back'], [3, 'inventory'],
                   [17, 'stats'], [8, 'stats'], [9, 'pause'], [4, 'tabPrev'], [5, 'tabNext']];
  for (const [button, action] of actions) {
    const down = pressed(button), wasDown = gamepadState.actions.has(button);
    if (down && !wasDown) {
      if (inWorld) Overworld.controllerAction(action);
      else if (action === 'primary') activate();
      else if (action === 'back') back();
      else if (action === 'attack' && button === 2 && state.screen === 'slots' && state.sel < 3) {
        // Square deletes the highlighted save slot on the slot screen.
        state.deleteSlot = state.sel + 1;
        go('deleteConfirm');
      }
    }
    if (!down && wasDown && action === 'attack' && inWorld) Overworld.controllerAction('attackRelease');
    if (down) gamepadState.actions.add(button); else gamepadState.actions.delete(button);
  }
}

function frame(now) {
  pollGamepad(now);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  t += dt;
  if (inWorld) {
    ctx.textAlign = 'left';
    Overworld.update(dt);
    Overworld.draw();
  } else {
    update(dt);
    draw();
  }
  drawCRT();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
