<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pixeltopia</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0b1a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: min(90vw, 960px);
      aspect-ratio: 4 / 3;
      image-rendering: pixelated;
      border: 4px solid #2e2e5c;
    }
  </style>
</head>
<body>
<canvas id="game" width="320" height="240"></canvas>

<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let scene = "title";
  let blink = 0;

  function drawTitle() {
    ctx.fillStyle = "#0b0b1a";
    ctx.fillRect(0, 0, 320, 240);

    // Simple pixel stars
    ctx.fillStyle = "#ffffff";
    for (let i = 0; i < 40; i++) {
      ctx.fillRect((i * 73) % 320, (i * 37) % 240, 1, 1);
    }

    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 28px monospace";
    ctx.textAlign = "center";
    ctx.fillText("PIXELTOPIA", 160, 100);

    blink++;
    if (Math.floor(blink / 30) % 2 === 0) {
      ctx.fillStyle = "#ffffff";
      ctx.font = "12px monospace";
      ctx.fillText("PRESS ENTER TO START", 160, 170);
    }
  }

  function drawGame() {
    ctx.fillStyle = "#2a6f3a";
    ctx.fillRect(0, 0, 320, 240);
    ctx.fillStyle = "#ffffff";
    ctx.font = "16px monospace";
    ctx.textAlign = "center";
    ctx.fillText("Your game starts here", 160, 120);
  }

  document.addEventListener("keydown", (e) => {
    if (scene === "title" && e.key === "Enter") scene = "game";
  });

  function loop() {
    if (scene === "title") drawTitle();
    else drawGame();
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
