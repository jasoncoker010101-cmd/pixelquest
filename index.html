<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixelquest</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 960px;
      height: 720px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="game" width="320" height="240"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const W = 320, H = 240;

    let t = 0;
    let screen = 'title';
    let sel = 0;
    let message = '';
    let music = true;
    let sound = true;

    const BTN_X = 85, BTN_W = 150, BTN_H = 20, BTN_Y0 = 100, BTN_GAP = 28;

    // Deterministic grass blades
    const blades = [];
    let seed = 42;
    function rand() {
      seed = (seed * 16807) % 2147483647;
      return seed / 2147483647;
    }
    for (let i = 0; i < 260; i++) {
      blades.push({
        x: Math.floor(rand() * W),
        y: 180 + Math.floor(rand() * 60),
        dark: rand() < 0.6
      });
    }

    const clouds = [
      [20, 30, 0.08],
      [150, 18, 0.05],
      [240, 44, 0.07]
    ];

    // ---------- Geometry helpers for building the horse sprite ----------
    function distToSeg(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1, dy = y2 - y1;
      let u = ((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy);
      u = Math.max(0, Math.min(1, u));
      const qx = x1 + u * dx - px, qy = y1 + u * dy - py;
      return Math.sqrt(qx * qx + qy * qy);
    }
    // Capsule: [x1, y1, x2, y2, radius] - a thick line with rounded ends
    function inCap(px, py, c) {
      return distToSeg(px, py, c[0], c[1], c[2], c[3]) <= c[4];
    }
    // Ellipse: [cx, cy, rx, ry]
    function inEll(px, py, e) {
      const dx = (px - e[0]) / e[2], dy = (py - e[1]) / e[3];
      return dx * dx + dy * dy <= 1;
    }

    const COL = {
      base:  [139, 90, 43],
      shade: [106, 66, 32],
      dark:  [43, 26, 14],
      eye:   [0, 0, 0],
      hoof:  [30, 18, 10],
      grass: [108, 192, 74]
    };

    // Builds a horse sprite (facing left) once, grazing or head-up
    function makeHorse(grazing) {
      const SW = 28, SH = 24;
      const c = document.createElement('canvas');
      c.width = SW; c.height = SH;
      const g = c.getContext('2d');
      const img = g.createImageData(SW, SH);
      const d = img.data;

      const body = [14, 12, 8.5, 4.5];
      const legs = [
        [9, 15, 9, 21, 0.9],
        [11.5, 15, 11.5, 21, 0.9],
        [17.5, 15, 17.5, 21, 0.9],
        [20, 15, 20, 21, 0.9]
      ];
      const tail = [22.5, 9, 25, 17, 1.2];
      const neck = grazing ? [8, 10, 3, 15, 2.6] : [8, 10, 5, 4, 2.8];
      const head = grazing ? [3, 15, 1.5, 20.5, 2.1] : [5, 4, 2, 9.5, 2.2];
      const mane = grazing ? [7.5, 8.5, 4, 13, 1.1] : [6.5, 3.5, 10, 9.5, 1.2];
      const ear  = grazing ? [2.6, 14, 2, 12.6, 0.6] : [4.6, 3, 5, 1.2, 0.7];
      const eye  = grazing ? [2.2, 17.2] : [3.2, 6.6];

      for (let y = 0; y < SH; y++) {
        for (let x = 0; x < SW; x++) {
          const px = x + 0.5, py = y + 0.5;
          let col = null;

          if (inCap(px, py, tail)) col = COL.dark;
          for (const L of legs) {
            if (inCap(px, py, L)) col = py > 20 ? COL.hoof : COL.base;
          }
          if (inEll(px, py, body) || inCap(px, py, neck) || inCap(px, py, head)) {
            col = py > 13.5 ? COL.shade : COL.base;
          }
          if (inCap(px, py, mane)) col = COL.dark;
          if (inCap(px, py, ear)) col = COL.dark;
          if (Math.abs(px - eye[0]) < 0.6 && Math.abs(py - eye[1]) < 0.6) col = COL.eye;

          if (col) {
            const i = (y * SW + x) * 4;
            d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
          }
        }
      }
      g.putImageData(img, 0, 0);
      return c;
    }

    const horseStand = makeHorse(false);
    const horseGraze = makeHorse(true);

    // ---------- Drawing helpers ----------
    function r(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), w, h);
    }

    function drawSky() {
      r(0, 0, W, 90, '#5fb8e8');
      r(0, 90, W, 40, '#8fd3f0');
      r(0, 130, W, 20, '#b8e6f7');
    }

    function drawCloud(x, y) {
      r(x, y, 22, 5, '#ffffff');
      r(x + 4, y - 3, 10, 3, '#ffffff');
      r(x + 16, y - 2, 6, 2, '#ffffff');
      r(x, y + 5, 22, 1, '#d6ecf7');
    }

    function drawClouds() {
      for (const c of clouds) {
        const x = ((c[0] + t * c[2]) % (W + 40)) - 30;
        drawCloud(x, c[1]);
      }
    }

    function drawHills() {
      for (let x = 0; x < W; x++) {
        const h = 150 + Math.round(8 * Math.sin(x * 0.03) + 4 * Math.sin(x * 0.11));
        r(x, h, 1, H - h, '#3f8f3f');
        r(x, h, 1, 1, '#2d6e2d');
      }
    }

    function drawField() {
      r(0, 178, W, 62, '#4d9e3a');
      r(0, 178, W, 2, '#3b7d2c');
      for (const b of blades) {
        const c = b.dark ? '#2f7a2a' : '#6cc04a';
        r(b.x, b.y, 1, 3, c);
        r(b.x - 1, b.y + 1, 1, 1, c);
        r(b.x + 1, b.y, 1, 1, c);
      }
    }

    function drawHorses() {
      // Back row of grazing horses, each on its own cycle
      const spots = [[18, 160], [96, 164], [210, 159], [262, 163]];
      spots.forEach(([x, y], i) => {
        const grazing = (Math.floor(t / 120) + i) % 2 === 1;
        ctx.drawImage(grazing ? horseGraze : horseStand, x, y);
        if (grazing && Math.floor(t / 10) % 2 === 0) {
          r(x - 1, y + 23, 1, 1, '#6cc04a');
          r(x + 1, y + 24, 1, 1, '#6cc04a');
        }
      });
    }

    function drawPanel() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.fillRect(60, 40, 200, 160);
    }

    function drawText(str, x, y, size, color, align = 'center') {
      ctx.font = `bold ${size}px "Courier New", monospace`;
      ctx.textAlign = align;
      ctx.textBaseline = 'middle';
      ctx.fillStyle = color;
      ctx.fillText(str, x, y);
    }

    // ---------- Menu logic ----------
    function go(s) {
      screen = s;
      sel = 0;
      message = '';
    }

    function items() {
      if (screen === 'title') {
        return [
          { label: 'START GAME', run: () => go('slots') },
          { label: 'SETTINGS', run: () => go('settings') },
          { label: 'CREDITS', run: () => go('credits') }
        ];
      }
      if (screen === 'slots') {
        const slots = [1, 2, 3].map(n => ({
          label: `SLOT ${n} - EMPTY`,
          run: () => { message = `SLOT ${n} SELECTED. GAME COMING SOON.`; }
        }));
        return slots.concat([{ label: 'BACK', run: () => go('title') }]);
      }
      if (screen === 'settings') {
        return [
          { label: `MUSIC: ${music ? 'ON' : 'OFF'}`, run: () => { music = !music; } },
          { label: `SOUND: ${sound ? 'ON' : 'OFF'}`, run: () => { sound = !sound; } },
          { label: 'BACK', run: () => go('title') }
        ];
      }
      return [{ label: 'BACK', run: () => go('title') }];
    }

    function drawButton(i, label, selected) {
      const y = BTN_Y0 + i * BTN_GAP;
      r(BTN_X, y, BTN_W, BTN_H, selected ? '#ffd34d' : '#2a3d1f');
      r(BTN_X + 2, y + 2, BTN_W - 4, BTN_H - 4, selected ? '#5a4a10' : '#1d2c15');
      drawText(label, W / 2, y + BTN_H / 2 + 1, 10, selected ? '#ffffff' : '#c8e6a0');
      if (selected) {
        drawText('>', BTN_X + 9, y + BTN_H / 2 + 1, 10, '#ffd34d', 'center');
      }
    }

    function drawMenu() {
      drawPanel();

      if (screen === 'title') {
        drawText('PIXELQUEST', W / 2 + 2, 62, 26, '#1a2a10');
        drawText('PIXELQUEST', W / 2, 60, 26, '#ffd34d');
      } else if (screen === 'slots') {
        drawText('SELECT SAVE SLOT', W / 2, 60, 14, '#ffd34d');
      } else if (screen === 'settings') {
        drawText('SETTINGS', W / 2, 60, 14, '#ffd34d');
      } else if (screen === 'credits') {
        drawText('CREDITS', W / 2, 52, 14, '#ffd34d');
        drawText('PIXELQUEST', W / 2, 70, 10, '#ffffff');
        drawText('MADE BY JASON COKER', W / 2, 82, 9, '#c8e6a0');
        drawText('THANKS FOR PLAYING', W / 2, 92, 9, '#c8e6a0');
      }

      const list = items();
      list.forEach((item, i) => drawButton(i, item.label, i === sel));

      if (message) {
        drawText(message, W / 2, 214, 8, '#ffffff');
      }
    }

    function hitIndex(mx, my) {
      const n = items().length;
      for (let i = 0; i < n; i++) {
        const y = BTN_Y0 + i * BTN_GAP;
        if (mx >= BTN_X && mx <= BTN_X + BTN_W && my >= y && my <= y + BTN_H) return i;
      }
      return -1;
    }

    function toCanvas(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * W / rect.width,
        y: (e.clientY - rect.top) * H / rect.height
      };
    }

    canvas.addEventListener('mousemove', (e) => {
      const p = toCanvas(e);
      const i = hitIndex(p.x, p.y);
      if (i >= 0) sel = i;
    });

    canvas.addEventListener('click', (e) => {
      const p = toCanvas(e);
      const i = hitIndex(p.x, p.y);
      if (i >= 0) {
        sel = i;
        items()[i].run();
      }
    });

    window.addEventListener('keydown', (e) => {
      const n = items().length;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        sel = (sel - 1 + n) % n;
        e.preventDefault();
      } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        sel = (sel + 1) % n;
        e.preventDefault();
      } else if (e.key === 'Enter' || e.key === ' ') {
        items()[sel].run();
        e.preventDefault();
      } else if (e.key === 'Escape' && screen !== 'title') {
        go('title');
      }
    });

    // ---------- Main loop ----------
    function frame() {
      t++;
      drawSky();
      drawClouds();
      drawHills();
      drawField();
      drawHorses();
      drawMenu();
      requestAnimationFrame(frame);
    }

    frame();
  </script>
</body>
</html>
