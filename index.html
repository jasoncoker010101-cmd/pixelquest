<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixelquest</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #09080b; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .tv-shell {
    position: relative; width: min(96vw, 1040px, calc(88dvh * 4 / 3)); max-height: 88dvh; aspect-ratio: 4 / 3;
    padding: clamp(10px, 2vw, 24px); border-radius: 7% / 9%;
    background: linear-gradient(145deg, #39363a, #171619 42%, #29262a 72%, #111);
    box-shadow: 0 24px 65px #000, inset 0 2px 4px #7778, inset 0 -7px 12px #000;
  }
  .tv-shell::before {
    content: ""; position: absolute; inset: 3.5%; border-radius: 7% / 9%;
    border: 2px solid #080709; box-shadow: inset 0 0 0 2px #ffffff0b, 0 1px 2px #7775;
    pointer-events: none; z-index: 2;
  }
  .tv-shell::after {
    content: ""; position: absolute; inset: clamp(10px, 2vw, 24px);
    border-radius: 4% / 5%; pointer-events: none; z-index: 3;
    background: radial-gradient(ellipse at center, transparent 66%, #05020b45 100%);
    box-shadow: inset 0 0 16px #0007;
  }
  .tv-shell.clean-screen::after { display: none; }
  .tv-shell.clean-screen canvas { filter: none; }
  canvas {
    display: block; width: 100%; height: 100%; border-radius: 4% / 5%;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; filter: saturate(.88) contrast(1.08);
  }
  @media (max-width: 900px) {
    body { min-height: 100dvh; padding: 12px 0; }
    .tv-shell { width: min(90vw, calc(82dvh * 4 / 3)); max-height: 82dvh; padding: 8px; }
  }
  @media (max-width: 600px) {
    .tv-shell { width: min(88vw, calc(76dvh * 4 / 3)); max-height: 76dvh; padding: 7px; }
    .tv-shell::after { inset: 7px; }
  }
  .mobile-controls {
    display: none; position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 10px);
    align-items: end; justify-content: space-between; gap: 8px; pointer-events: none;
    -webkit-tap-highlight-color: transparent;
  }
  .tv-shell.playing[data-input="touch"] .mobile-controls { display: flex; }
  .mobile-pad {
    display: grid; flex: 0 0 112px; width: 112px; height: 112px;
    grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 3px;
    border: 1px solid #80694e; border-radius: 27%; background: #18131e;
    box-shadow: 0 3px 8px #0009; touch-action: none; pointer-events: auto; user-select: none;
  }
  .mobile-pad span {
    display: grid; place-items: center; color: #f1dfb7; background: #352a3a; font: bold 16px monospace;
    pointer-events: none;
  }
  .mobile-pad [data-dir="ArrowUp"] { grid-area: 1 / 2; border-radius: 10px 10px 0 0; }
  .mobile-pad [data-dir="ArrowLeft"] { grid-area: 2 / 1; border-radius: 10px 0 0 10px; }
  .mobile-pad [data-dir="ArrowRight"] { grid-area: 2 / 3; border-radius: 0 10px 10px 0; }
  .mobile-pad [data-dir="ArrowDown"] { grid-area: 3 / 2; border-radius: 0 0 10px 10px; }
  .mobile-pad .pad-center { grid-area: 2 / 2; color: #a58e72; background: #3e3041; }
  .mobile-right { width: min(184px, calc(100% - 120px)); display: grid; gap: 4px; }
  .mobile-utility, .mobile-actions { display: grid; gap: 4px; }
  .mobile-utility { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .mobile-actions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .mobile-controls button {
    min-width: 0; min-height: 44px; padding: 0 2px; border: 1px solid #80694e; border-radius: 9px;
    background: #292131; color: #fff0c5; font: bold 10px monospace;
    box-shadow: 0 2px 5px #0009; touch-action: none; pointer-events: auto; user-select: none;
  }
  .mobile-utility button { background: #201927; color: #e3d1c0; }
  .mobile-actions .touch-attack { grid-column: span 2; background: #572b39; border-color: #c07872; }
  .mobile-actions .touch-jump {
    grid-area: 1 / 3 / span 2; background: #304255; border-color: #829cb5; border-radius: 18px;
  }
  .mobile-controls .pressed, .mobile-controls button:active { background: #a36d43; color: #fff8e6; }

  .tv-fullscreen-btn {
    position: absolute; z-index: 6; right: 5%; bottom: 1.2%;
    border: 1px solid #c5a978; border-radius: 5px;
    padding: 5px 9px; color: #f8e8c4; background: #17121ddd;
    font: bold 10px monospace; letter-spacing: .5px;
    box-shadow: 0 2px 6px #000a; cursor: pointer;
    touch-action: manipulation;
  }
  .tv-fullscreen-btn:active { background: #60432f; }
  .tv-shell:fullscreen {
    width: 100vw; height: 100dvh; max-width: none; max-height: none;
    aspect-ratio: auto; padding: 0; border-radius: 0;
    display: flex; align-items: center; justify-content: center;
    background: #09080b; box-shadow: none; overflow: hidden;
  }
  .tv-shell:fullscreen canvas {
    width: min(100vw, calc(100dvh * 4 / 3));
    height: min(100dvh, calc(100vw * 3 / 4));
    flex: 0 0 auto;
  }
  .tv-shell:fullscreen::before {
    inset: max(1%, 5px); border-radius: 3% / 4%;
  }
  .tv-shell:fullscreen::after {
    inset: max(1.5%, 8px); border-radius: 3% / 4%;
  }
  .tv-shell:fullscreen .tv-fullscreen-btn {
    right: max(3%, 14px); bottom: max(2%, 12px);
    opacity: .72;
  }
  @media (max-width: 600px) {
    .tv-fullscreen-btn { right: 4%; bottom: 1%; padding: 4px 7px; font-size: 9px; }
  }

  .tv-shell.playing[data-input="touch"]:not(:fullscreen) {
    margin-bottom: 154px; width: min(94vw, 680px, calc((100dvh - 172px) * 4 / 3));
  }
  .tv-shell.playing[data-input="touch"]:not(:fullscreen) .mobile-controls {
    width: max(100%, min(94vw, 312px)); left: 50%; right: auto; transform: translateX(-50%);
  }
  .tv-shell.playing[data-input="touch"]:fullscreen canvas {
    width: min(100vw, calc((100dvh - 166px) * 4 / 3)); height: auto; aspect-ratio: 4 / 3;
    transform: translateY(-77px);
  }
  .tv-shell.playing[data-input="touch"]:fullscreen .mobile-controls {
    top: auto; left: 3%; right: 3%; bottom: max(8px, env(safe-area-inset-bottom));
  }
  .tv-shell.playing[data-input="touch"]:fullscreen .tv-fullscreen-btn { top: 10px; bottom: auto; }
  @media (orientation: landscape) and (min-width: 590px) {
    .tv-shell.playing[data-input="touch"]:not(:fullscreen) {
      width: min(calc(100vw - 356px), calc(92dvh * 4 / 3), 1040px);
      margin-bottom: 0; transform: translateX(-36px);
    }
    .tv-shell.playing[data-input="touch"]:not(:fullscreen) .mobile-controls {
      width: 94vw; top: auto; bottom: 5px; left: calc(50% + 36px);
    }
    .tv-shell.playing[data-input="touch"]:fullscreen canvas {
      width: min(calc(100vw - 356px), calc(100dvh * 4 / 3)); transform: translateX(-36px);
    }
  }
  #account-dialog { width: min(92vw, 400px); max-height: 90dvh; overflow: auto; border: 1px solid #a78355; border-radius: 12px; padding: 24px; background: #19151e; color: #f6ead5; font: 15px/1.5 system-ui, sans-serif; }
  #account-dialog::backdrop { background: #07060bd9; }
  #account-dialog h2 { color: #ffe2aa; margin: 0 0 12px; font: bold 20px monospace; }
  #account-dialog label { display: block; margin: 12px 0; }
  #account-dialog label[hidden] { display: none; }
  #account-dialog input { display: block; width: 100%; margin-top: 4px; padding: 8px 10px; border: 1px solid #947956; border-radius: 5px; background: #0f0d14; color: #fff; font: 16px system-ui; }
  #account-dialog button { min-height: 42px; border: 1px solid #9c805b; border-radius: 5px; padding: 6px 12px; background: #292130; color: #fff1d3; font: inherit; cursor: pointer; }
  #account-submit { background: #684832 !important; }
  #account-dialog :focus-visible { outline: 2px solid #ffdca1; outline-offset: 2px; }
  #account-feedback { color: #ffdb9c; min-height: 1.5em; }
</style>

<script>
(async function pixelquestUpdateLoader(){
  const repoApi = 'https://api.github.com/repos/jasoncoker010101-cmd/pixelquest/branches/main';
  const official = location.hostname === 'jasoncoker010101-cmd.github.io';
  const params = new URLSearchParams(location.search);
  const currentRev = params.get('pqrev') || '';
  async function getLatestRevision(){
    try {
      const response = await fetch(repoApi, { cache: 'no-store', headers: { Accept: 'application/vnd.github+json' }, signal: AbortSignal.timeout(3500) });
      if (!response.ok) throw new Error('GitHub update check failed');
      const data = await response.json();
      return data && data.commit && data.commit.sha ? data.commit.sha : '';
    } catch (_) { return ''; }
  }
  const latest = official ? await getLatestRevision() : '';
  // Only select a runtime asset revision. Never reload the page or interrupt play.
  window.PQ_REV = latest || currentRev || String(Date.now());
  const gameScript = document.createElement('script');
  gameScript.src = 'world.js?rev=' + encodeURIComponent(window.PQ_REV);
  gameScript.onerror = () => {
    // If GitHub's API is unavailable, still bypass the browser's cached script.
    const fallback = document.createElement('script');
    fallback.src = 'world.js?reload=' + Date.now();
    fallback.onerror = () => { message = 'GAME COULD NOT LOAD. REFRESH TO RETRY.'; };
    document.body.appendChild(fallback);
  };
  document.body.appendChild(gameScript);
})();
</script>
<script>
const tvShell = document.getElementById('tvShell');
const tvFullscreenButton = document.getElementById('tvFullscreen');
async function toggleTVFullscreen() {
  try {
    if (document.fullscreenElement === tvShell) {
      await document.exitFullscreen();
    } else if (tvShell.requestFullscreen) {
      await tvShell.requestFullscreen();
    } else {
      message = 'Fullscreen is not supported by this browser.';
    }
  } catch (error) {
    message = 'Could not enter fullscreen. Try rotating your device or browser settings.';
  }
}
tvFullscreenButton.addEventListener('click', toggleTVFullscreen);
document.addEventListener('fullscreenchange', () => {
  const active = document.fullscreenElement === tvShell;
  tvFullscreenButton.textContent = active ? '⛶ EXIT TV' : '⛶ TV FULLSCREEN';
  tvFullscreenButton.setAttribute('aria-label', active ? 'Exit TV fullscreen' : 'Enter TV fullscreen');
});
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let t = 0, last = performance.now(), message = '';
const settings = { music: true, sound: true, blood: true, crt: true };
const BLOOD_PREF = 'pixelquest-blood-effects';
let browserSavesAvailable = true;
try {
  settings.blood = localStorage.getItem(BLOOD_PREF) !== 'off';
  settings.music = localStorage.getItem('pixelquest-music') !== 'off';
  settings.sound = localStorage.getItem('pixelquest-sound') !== 'off';
  settings.crt = localStorage.getItem('pixelquest-crt') !== 'off';
} catch { browserSavesAvailable = false; }
tvShell.classList.toggle('clean-screen', !settings.crt);
function toggleDisplaySetting(key) {
  settings[key] = !settings[key];
  if (key === 'crt') tvShell.classList.toggle('clean-screen', !settings.crt);
  try { localStorage.setItem('pixelquest-' + key, settings[key] ? 'on' : 'off'); } catch {}
}
function toggleBloodEffects() {
  settings.blood = !settings.blood;
  try { localStorage.setItem(BLOOD_PREF, settings.blood ? 'on' : 'off'); } catch {}
  if (typeof Overworld !== 'undefined') Overworld.setBloodEffects(settings.blood);
}
const state = { screen: 'title', sel: 0 };
let inWorld = false;
let activeSlot = 0;
const SAVE_KEY = 'pixelquest-save-';
const CLOUD_URL = 'https://nvqurbmopxohbcjxuogy.supabase.co';
const CLOUD_KEY = 'sb_publishable_xLrZKJZnifoDQFvBXFbgug_5DmzsypK';
const AUTH_KEY = 'pixelquest-auth-session';
let cloudSession = null;
let cloudProfile = null;
let refreshInFlight = null;
let enteringWorld = false;
let accountMode = '';
let accountBusy = false;
const accountDialog = document.querySelector('#account-dialog');
const accountForm = document.querySelector('#account-form');
const accountEmail = document.querySelector('#account-email');
const accountPassword = document.querySelector('#account-password');
const accountName = document.querySelector('#account-name');
const accountFeedback = document.querySelector('#account-feedback');
const accountSubmit = document.querySelector('#account-submit');
const accountClose = document.querySelector('#account-close');
const slotWrites = new Map();
const memorySlots = new Map();
const sessionUser = () => cloudSession?.user?.id || null;
try { cloudSession = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch { cloudSession = null; }
if (!sessionUser() || !cloudSession.access_token) cloudSession = null;

function storeSession(session) {
  cloudSession = session;
  try {
    if (session) localStorage.setItem(AUTH_KEY, JSON.stringify(session));
    else localStorage.removeItem(AUTH_KEY);
  } catch {}
}

async function authRequest(path, body) {
  const response = await fetch(CLOUD_URL + '/auth/v1/' + path, {
    method: 'POST',
    headers: { apikey: CLOUD_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body), signal: AbortSignal.timeout(12000)
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.msg || data.message || data.error_description || data.error || 'Account request failed.');
  return data;
}

async function refreshCloudSession() {
  if (!cloudSession || !cloudSession.refresh_token) return false;
  if (refreshInFlight) return refreshInFlight;
  const old = cloudSession;
  refreshInFlight = (async () => {
    try {
      const data = await authRequest('token?grant_type=refresh_token', { refresh_token: old.refresh_token });
      if (cloudSession !== old || data.user?.id !== old.user.id) return false;
      storeSession(data);
      return true;
    } catch { return false; }
  })().finally(() => { refreshInFlight = null; });
  return refreshInFlight;
}

async function cloudRequest(path, options = {}, retry = true) {
  if (!cloudSession) throw new Error('Sign in to use cloud saves.');
  const session = cloudSession;
  const response = await fetch(CLOUD_URL + path, {
    ...options, signal: AbortSignal.timeout(12000),
    headers: {
      apikey: CLOUD_KEY,
      Authorization: 'Bearer ' + session.access_token,
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });
  if (response.status === 401 && retry && sessionUser() === session.user.id &&
      (cloudSession !== session || await refreshCloudSession()) && sessionUser() === session.user.id) return cloudRequest(path, options, false);
  const body = response.status === 204 ? null : await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.message || body.details || body.hint || 'Cloud request failed.');
  return body;
}

async function loadCloudProfile() {
  if (!cloudSession) return null;
  const rows = await cloudRequest('/rest/v1/profiles?select=username&id=eq.' + encodeURIComponent(cloudSession.user.id) + '&limit=1');
  cloudProfile = rows && rows[0] ? rows[0] : null;
  return cloudProfile;
}

async function saveCloudProfile(username) {
  await cloudRequest('/rest/v1/profiles?on_conflict=id', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ id: cloudSession.user.id, username, updated_at: new Date().toISOString() })
  });
  cloudProfile = { username };
}

async function loadCloudSlot(slot) {
  const rows = await cloudRequest('/rest/v1/game_saves?select=save_data&slot=eq.' + slot + '&user_id=eq.' + encodeURIComponent(cloudSession.user.id) + '&limit=1');
  return rows && rows[0] ? rows[0].save_data : null;
}

async function saveCloudSlot(slot, data) {
  if (!cloudSession || !data) return;
  await cloudRequest('/rest/v1/game_saves?on_conflict=user_id,slot', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ user_id: cloudSession.user.id, slot, save_data: data, updated_at: new Date().toISOString() })
  });
}

async function deleteCloudSlot(slot) {
  if (!cloudSession) return;
  await cloudRequest('/rest/v1/game_saves?slot=eq.' + slot + '&user_id=eq.' + encodeURIComponent(cloudSession.user.id), {
    method: 'DELETE',
    headers: { Prefer: 'return=minimal' }
  });
}

function openAccountForm(mode) {
  accountMode = mode;
  accountForm.reset(); accountFeedback.textContent = '';
  const profile = mode === 'profile', signup = mode === 'signup';
  document.querySelector('#account-heading').textContent = profile ? 'Player profile' : signup ? 'Create an account' : 'Sign in';
  document.querySelector('#account-help').textContent = profile ? 'Change the name shown in your account.' :
    signup ? 'Use an email you can open. You’ll need to confirm it before signing in.' : 'Sign in to access your own save slots.';
  for (const [field, visible] of [[accountEmail,!profile],[accountPassword,!profile],[accountName,profile || signup]]) {
    field.closest('label').hidden = !visible;
    field.disabled = !visible;
    field.required = visible;
  }
  accountPassword.minLength = signup ? 6 : 1;
  accountPassword.autocomplete = signup ? 'new-password' : 'current-password';
  accountName.value = profile ? (cloudProfile?.username || '') : '';
  accountSubmit.textContent = profile ? 'Save name' : signup ? 'Create account' : 'Sign in';
  accountDialog.showModal();
  (profile ? accountName : accountEmail).focus();
}
accountClose.addEventListener('click', () => { if (!accountBusy) accountDialog.close(); });
accountDialog.addEventListener('cancel', e => { if (accountBusy) e.preventDefault(); });
accountDialog.addEventListener('close', () => { if (!accountDialog.open) accountPassword.value = ''; });
accountForm.addEventListener('submit', async e => {
  e.preventDefault();
  if (accountBusy) return;
  const mode = accountMode, name = accountName.value.trim();
  if (mode !== 'signin' && name.length < 3) { accountFeedback.textContent = 'Enter at least 3 characters for your player name.'; return; }
  accountBusy = accountSubmit.disabled = accountClose.disabled = true;
  accountFeedback.textContent = mode === 'signup' ? 'Creating account…' : mode === 'profile' ? 'Saving name…' : 'Signing in…';
  try {
    if (mode === 'profile') {
      await saveCloudProfile(name); message = 'Player name updated.'; accountDialog.close(); return;
    }
    const payload = { email: accountEmail.value.trim(), password: accountPassword.value };
    if (mode === 'signup') payload.data = { player_name: name };
    const data = await authRequest(mode === 'signup' ? 'signup' : 'token?grant_type=password', payload);
    if (!data.access_token) {
      if (mode !== 'signup') throw new Error('Could not sign in. Try again.');
      accountPassword.value = '';
      accountFeedback.textContent = 'Check your inbox and spam for a confirmation link. Then return here and choose Sign In. If you already have an account, try signing in now.';
      return;
    }
    if (!data.user?.id) throw new Error('Could not load your account.');
    cloudProfile = null;
    storeSession(data);
    state.sel = 0;
    try {
      await loadCloudProfile();
      if (!cloudProfile) {
        const chosen = String(data.user.user_metadata?.player_name || name).trim().slice(0, 24);
        await saveCloudProfile(chosen.length >= 3 ? chosen : 'Player' + data.user.id.slice(0, 6));
      }
      message = 'Signed in.';
      accountDialog.close();
    } catch {
      accountFeedback.textContent = 'You’re signed in, but your profile could not load. Close this form to continue.';
    }
  } catch (error) {
    accountFeedback.textContent = error instanceof TypeError || error.name === 'TimeoutError' ?
      'Could not reach the account service. Try again, or play as a guest.' : error.message;
  } finally {
    accountBusy = accountSubmit.disabled = accountClose.disabled = false;
    if (sessionUser() && mode !== 'profile' && accountDialog.open) accountSubmit.disabled = true;
  }
});

async function signOut() {
  try {
    if (cloudSession) await cloudRequest('/auth/v1/logout', { method: 'POST' }).catch(() => {});
  } finally {
    storeSession(null);
    cloudProfile = null;
    message = 'Signed out. Browser saves are still available.';
  }

function drawPixelTree(x, baseY, scale, shade, highlight, variant = 0) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(baseY));
  ctx.scale(scale, scale);

  // Layered, stepped canopy makes a forest silhouette instead of smooth triangles.
  const rows = variant % 2
    ? [[5,-53],[10,-47],[15,-41],[19,-35],[22,-29],[23,-23],[21,-17],[17,-11],[12,-5]]
    : [[4,-55],[9,-49],[14,-43],[18,-37],[21,-31],[22,-25],[20,-19],[16,-13],[11,-7]];
  ctx.fillStyle = '#0b1220';
  ctx.fillRect(-2, -5, 4, 18);
  ctx.fillStyle = shade;
  rows.forEach(([width, yy], index) => {
    ctx.fillRect(-width, yy, width * 2, 7);
    if (index > 1 && index < 7) {
      ctx.fillStyle = highlight;
      ctx.fillRect(-width + 2, yy + 1, Math.max(2, Math.floor(width * 0.45)), 2);
      ctx.fillStyle = shade;
    }
  });
  ctx.fillStyle = '#101b25';
  ctx.fillRect(-1, 1, 2, 10);
  ctx.restore();
}

function drawForestLayer(baseY, scale, speed, palette, count, seed) {
  const drift = (t * speed) % 38;
  for (let i = -1; i <= count; i++) {
    const r = rnd(i + seed);
    const x = i * 38 - drift + r * 9;
    const treeScale = scale * (0.78 + rnd(i + seed + 22) * 0.42);
    const y = baseY + rnd(i + seed + 44) * 7;
    drawPixelTree(x, y, treeScale, palette[0], palette[1], i + seed);
  }
}

function drawForestMist() {
  ctx.save();
  clouds.forEach((c, i) => {
    const opacity = 0.055 + 0.025 * Math.sin(t * 0.45 + i);
    ctx.fillStyle = 'rgba(180,190,202,' + opacity + ')';
    ctx.fillRect(Math.round(c.x), c.y, c.w, 5);
    ctx.fillRect(Math.round(c.x + 8), c.y - 3, Math.max(8, c.w - 22), 3);
    ctx.fillRect(Math.round(c.x + 20), c.y + 5, Math.max(8, c.w - 40), 2);
  });
  ctx.restore();
}

function drawWoodlandGround() {
  ctx.fillStyle = '#192b27';
  ctx.fillRect(0, 164, 320, 76);
  ctx.fillStyle = '#20342b';
  ctx.fillRect(0, 185, 320, 55);

  // A narrow old trail disappears into the woods behind the menu.
  ctx.fillStyle = '#463d38';
  ctx.beginPath();
  ctx.moveTo(143, 165); ctx.lineTo(176, 165);
  ctx.lineTo(184, 190); ctx.lineTo(226, 240);
  ctx.lineTo(86, 240); ctx.lineTo(137, 190);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#665344';
  ctx.beginPath();
  ctx.moveTo(148, 170); ctx.lineTo(169, 170);
  ctx.lineTo(178, 196); ctx.lineTo(203, 240);
  ctx.lineTo(108, 240); ctx.lineTo(143, 196);
  ctx.closePath(); ctx.fill();

  // Uneven grass tufts and a few pale stones, anchored to the landscape.
  for (let i = 0; i < 115; i++) {
    const x = Math.floor(rnd(i + 800) * 320);
    const y = 171 + Math.floor(rnd(i + 1100) * 66);
    const sway = Math.round(Math.sin(t * 1.15 + i * 0.7) * 1);
    ctx.fillStyle = y > 205 ? '#111f1d' : '#526044';
    ctx.fillRect(x + sway, y, 1, 2 + (i % 3));
    if (i % 13 === 0) {
      ctx.fillStyle = '#817865';
      ctx.fillRect(x + 4, y + 4, 2, 1);
    }
  }
}

function drawFireflies() {
  motes.forEach((m, i) => {
    const pulse = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * 2 + m.ph));
    const x = Math.round(m.x + Math.sin(t * 0.8 + m.ph) * 2);
    const y = Math.round(m.y + Math.sin(t * 1.1 + m.ph) * 2);
    ctx.fillStyle = 'rgba(245,218,139,' + (pulse * 0.14) + ')';
    ctx.fillRect(x - 2, y - 2, 5, 5);
    ctx.fillStyle = 'rgba(255,236,165,' + (pulse * 0.9) + ')';
    ctx.fillRect(x, y, 2, 2);
  });
}

function drawCRT() {
  if (!settings.crt) return;
  ctx.save();
  // Fine horizontal phosphor lines and a soft curved-screen vignette.
  ctx.fillStyle = 'rgba(5, 3, 12, 0.07)';
  for (let y = 1; y < 240; y += 2) ctx.fillRect(0, y, 320, 1);
  const shade = ctx.createRadialGradient(160, 120, 72, 160, 120, 190);
  shade.addColorStop(0, 'rgba(0,0,0,0)');
  shade.addColorStop(0.72, 'rgba(0,0,0,0.04)');
  shade.addColorStop(1, 'rgba(0,0,0,0.24)');
  ctx.fillStyle = shade;
  ctx.fillRect(0, 0, 320, 240);
  ctx.restore();
}

// Native Gamepad API support for the PS5 DualSense (and other standard pads).
//
//   Left stick / D-pad  Move, navigate menus
//   ✕ Cross             Jump in the forest (interacts when a prompt is shown),
//                       interact / confirm everywhere else
//   □ Square            Attack            (R2 also attacks)
//   ○ Circle            Back / close / run from an encounter
//   △ Triangle          Inventory
//   Touchpad / Create   Stats
//   Options             Pause / resume
//   L1 / R1 / L2        Hold to run
const gamepadState = { held: new Set(), repeatAt: new Map(), actions: new Set(), index: -1 };
window.addEventListener('gamepadconnected', e => {
  if (!controllerConnected) gamepadState.index = e.gamepad.index;
  controllerConnected = true; syncControlMode();
});
function clearGamepad() {
  gamepadState.held.clear(); gamepadState.repeatAt.clear(); gamepadState.actions.clear();
  gamepadState.index = -1;
  if (inWorld) Overworld.clearHeldInput();
}
window.addEventListener('gamepaddisconnected', e => {
  if (gamepadState.index >= 0 && e.gamepad.index !== gamepadState.index) return;
  clearGamepad();
  controllerConnected = !!currentPad(); syncControlMode();
});
function dispatchPadKey(key, down, repeat = false) {
  // The "Pad" code lets the game tell stick/D-pad input apart from the keyboard,
  // so pushing up on the stick never makes the knight jump.
  window.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', {
    key, code: 'Pad' + key, bubbles: true, cancelable: true, repeat
  }));
}
function rumble(strong, weak, ms) {
  const pad = currentPad();
  const act = pad && pad.vibrationActuator;
  if (!act || !act.playEffect) return;
  try {
    const p = act.playEffect('dual-rumble', { startDelay: 0, duration: ms, strongMagnitude: strong, weakMagnitude: weak });
    if (p && p.catch) p.catch(() => {});
  } catch (_) {}
}
window.pqRumble = rumble;
let gamepadAccessDenied = false;
function currentPad() {
  if (gamepadAccessDenied || !navigator.getGamepads) return null;
  let pads;
  try { pads = navigator.getGamepads(); }
  catch { gamepadAccessDenied = true; return null; }
  if (gamepadState.index >= 0 && pads[gamepadState.index] && pads[gamepadState.index].connected) return pads[gamepadState.index];
  let fallback = null;
  for (let i = 0; i < pads.length; i++) {
    const p = pads[i];
    if (!p || !p.connected) continue;
    if (p.mapping === 'standard') return p;
    if (!fallback) fallback = p;
  }
  return fallback;
}
// Some browsers (notably Firefox) expose the DualSense without the standard
// mapping. Translate its raw layout into standard button numbers.
function readPad(pad) {
  const raw = i => !!(pad.buttons[i] && (pad.buttons[i].pressed || pad.buttons[i].value > 0.5));
  const axis = i => (pad.axes && Number.isFinite(pad.axes[i]) ? pad.axes[i] : 0);
  if (pad.mapping === 'standard') {
    return { pressed: raw, lx: axis(0), ly: axis(1) };
  }
  const sony = /054c|dualsense|wireless controller|playstation/i.test(pad.id || '');
  if (!sony) return { pressed: raw, lx: axis(0), ly: axis(1) };
  // Raw DualSense: 0 □, 1 ✕, 2 ○, 3 △, 4 L1, 5 R1, 6 L2, 7 R2, 8 Create,
  // 9 Options, 10 L3, 11 R3, 12 PS, 13 Touchpad; D-pad is a hat on axis 9.
  const hat = axis(9);
  const dir = hat >= -1.05 && hat <= 1.05 ? Math.round((hat + 1) * 3.5) % 8 : -1;
  const dpad = { 12: [7, 0, 1], 13: [3, 4, 5], 14: [5, 6, 7], 15: [1, 2, 3] };
  const map = { 0: 1, 1: 2, 2: 0, 3: 3, 4: 4, 5: 5, 6: 6, 7: 7, 8: 8, 9: 9, 10: 10, 11: 11, 16: 12, 17: 13 };
  return {
    pressed: i => (dpad[i] ? dir >= 0 && dpad[i].includes(dir) : map[i] !== undefined && raw(map[i])),
    lx: axis(0), ly: axis(1)
  };
}
function pollGamepad(now) {
  const pad = currentPad();
  if (!pad) {
    if (controllerConnected) { clearGamepad(); controllerConnected = false; syncControlMode(); }
    return;
  }
  if (gamepadState.index !== pad.index) {
    if (controllerConnected) clearGamepad();
    gamepadState.index = pad.index;
  }
  if (!controllerConnected) { controllerConnected = true; syncControlMode(); }
  const { pressed, lx, ly } = readPad(pad);
  const DEAD = 0.42;
  const next = new Set();
  if (pressed(14) || lx < -DEAD) next.add('ArrowLeft');
  if (pressed(15) || lx > DEAD) next.add('ArrowRight');
  if (pressed(12) || ly < -DEAD) next.add('ArrowUp');
  if (pressed(13) || ly > DEAD) next.add('ArrowDown');
  // Either shoulder (or L2) runs; release only after all are released.
  if (pressed(4) || pressed(5) || pressed(6)) next.add('Shift');
  for (const key of gamepadState.held) {
    if (!next.has(key)) { dispatchPadKey(key, false); gamepadState.repeatAt.delete(key); }
  }
  for (const key of next) {
    if (!gamepadState.held.has(key)) {
      dispatchPadKey(key, true); gamepadState.repeatAt.set(key, now + 280);
    } else if (!inWorld && key.startsWith('Arrow') && now >= (gamepadState.repeatAt.get(key) || 0)) {
      dispatchPadKey(key, true, true); gamepadState.repeatAt.set(key, now + 145);
    }
  }
  gamepadState.held = next;
  const actions = [[0, 'primary'], [2, 'attack'], [7, 'attack'], [1, 'back'], [3, 'inventory'],
                   [17, 'stats'], [8, 'stats'], [9, 'pause'], [4, 'tabPrev'], [5, 'tabNext']];
  for (const [button, action] of actions) {
    const down = pressed(button), wasDown = gamepadState.actions.has(button);
    if (down && !wasDown) {
      if (inWorld) Overworld.controllerAction(action);
      else if (action === 'primary') activate();
      else if (action === 'back') back();
      else if (action === 'attack' && button === 2 && state.screen === 'slots' && state.sel < 3) {
        // Square deletes the highlighted save slot on the slot screen.
        state.deleteSlot = state.sel + 1;
        go('deleteConfirm');
      }
    }
    if (!down && wasDown && action === 'attack' && inWorld) Overworld.controllerAction('attackRelease');
    if (down) gamepadState.actions.add(button); else gamepadState.actions.delete(button);
  }
}

function frame(now) {
  pollGamepad(now);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  t += dt;
  if (inWorld) {
    ctx.textAlign = 'left';
    Overworld.update(dt);
    Overworld.draw();
  } else {
    update(dt);
    draw();
  }
  drawCRT();
  requestAnimationFrame(frame);
}
window.render_game_to_text = () => inWorld ? Overworld.renderState() :
  JSON.stringify({ phase: document.getElementById('lock') ? 'locked' : state.screen, selection: state.sel, bloodEffects: settings.blood });
requestAnimationFrame(frame);
</script>
</body>
</html>
