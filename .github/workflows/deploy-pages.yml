name: Deploy Pixelquest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the newest site deployment should be allowed to run.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify the runtime and stage the site
        run: |
          mkdir -p "$RUNNER_TEMP/pixelquest-site"
          cp index.html world.js "$RUNNER_TEMP/pixelquest-site/"
          rsync -a --exclude='*.zip' --exclude='*.psd' --exclude='*.aseprite' \
            --exclude='*.pdf' --exclude='__MACOSX/' --exclude='._*' \
            --exclude='/goblinpack/' assets/ "$RUNNER_TEMP/pixelquest-site/assets/"
          node tools/verify-build.mjs "$RUNNER_TEMP/pixelquest-site"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pixelquest-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
