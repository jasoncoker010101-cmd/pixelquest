name: Extract forest tileset

on:
  push:
    branches: [main]
    paths:
      - "assets/TopDownFantasy_Forest_v1.zip"
      - ".github/workflows/extract-forest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract forest pack
        run: |
          mkdir -p assets/forest_pack
          unzip -o "assets/TopDownFantasy_Forest_v1.zip" -d assets/forest_pack
          find assets/forest_pack -type f -print
      - name: Install preview dependency
        run: python -m pip install pillow
      - name: Create preview
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          files = list(Path("assets/forest_pack").rglob("*.png"))
          thumbs=[]
          for p in files:
              im=Image.open(p).convert("RGBA")
              im.thumbnail((320,240), Image.Resampling.NEAREST)
              bg=Image.new("RGBA",(340,280),(32,32,32,255))
              bg.alpha_composite(im,((340-im.width)//2,8))
              d=ImageDraw.Draw(bg)
              d.text((8,252),p.name[:45],fill="white")
              thumbs.append(bg.convert("RGB"))
          if thumbs:
              cols=3; rows=(len(thumbs)+cols-1)//cols
              sheet=Image.new("RGB",(cols*340,rows*280),(24,24,24))
              for i,im in enumerate(thumbs): sheet.paste(im,((i%cols)*340,(i//cols)*280))
              sheet.save("forest-preview.jpg")
          PY
      - name: Create coordinate atlas preview
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          root = Path("assets/forest_pack/TopDownFantasy-Forest")
          decor = Image.open(root / "Decorations/Decorations.png").convert("RGBA")
          tiles = Image.open(root / "Tiles/Tileset.png").convert("RGBA")
          scale = 2
          margin = 24
          canvas = Image.new("RGBA", (decor.width*scale + margin*2, decor.height*scale + tiles.height*scale + 100), (28, 28, 34, 255))
          draw = ImageDraw.Draw(canvas)
          def place(im, y, label):
              draw.text((margin, y-18), label, fill=(255,255,255,255))
              big = im.resize((im.width*scale, im.height*scale), Image.Resampling.NEAREST)
              canvas.alpha_composite(big, (margin, y))
              for x in range(0, im.width+1, 16):
                  xx = margin + x*scale
                  draw.line((xx,y,xx,y+im.height*scale), fill=(255,0,255,180), width=1)
                  if x < im.width: draw.text((xx+2,y+2), str(x), fill=(255,255,255,255), stroke_width=2, stroke_fill=(0,0,0,255))
              for yy in range(0, im.height+1, 16):
                  py = y + yy*scale
                  draw.line((margin,py,margin+im.width*scale,py), fill=(255,0,255,180), width=1)
                  if yy < im.height: draw.text((margin+2,py+2), str(yy), fill=(255,255,255,255), stroke_width=2, stroke_fill=(0,0,0,255))
          place(decor, 44, "Decorations.png - pixel coordinates, 16px grid")
          place(tiles, 44 + decor.height*scale + 24, "Tileset.png - pixel coordinates, 16px grid")
          canvas.convert("RGB").save("assets/forest_pack/atlas-grid.jpg", quality=95)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forest-pack-preview
          path: |
            forest-preview.jpg
            assets/forest_pack/atlas-grid.jpg
      - name: Commit extracted assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/forest_pack
          if git diff --cached --quiet; then
            echo "No extracted assets changed."
          else
            git commit -m "Extract forest tileset assets"
            git push
          fi
